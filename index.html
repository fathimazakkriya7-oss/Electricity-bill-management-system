<!DOCTYPE html>
<html>
<head>
    <title>Electricity Bill Management System</title>
</head>
<body>
    <h1>Electricity Bill Management System</h1>

    <form>
        <label>Customer Name:</label><br>
        <input type="text" id="name"><br><br>

        <label>Customer ID:</label><br>
        <input type="text" id="cid"><br><br>

        <label>Units Consumed:</label><br>
        <input type="number" id="units"><br><br>

        <button type="button" onclick="calculateBill()">Generate Bill</button>
    </form>

    <h2 id="result"></h2>

    <script>
        function calculateBill() {
            let units = document.getElementById("units").value;
            let bill = units * 5; // ₹5 per unit

            document.getElementById("result").innerHTML =
                "Total Bill Amount: ₹" + bill;
        }
    </script>
</body>
</html>
